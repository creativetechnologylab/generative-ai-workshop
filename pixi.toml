[workspace]
authors = ["DolicaAkelloEgwel <d.akelloegwel@lcc.arts.ac.uk>"]
channels = ["conda-forge"]
name = "generative-ai-workshop"
platforms = [
  { platform = "win-64", cuda = "12.4" },
]
version = "0.1.0"

[tasks.download-hf-models]
cmd = """
hf download segmind/tiny-sd --include "*.safetensors" --include "*.json"
hf download nitrosocke/Ghibli-Diffusion --include "*.safetensors" --include "*.json"
hf download SimianLuo/LCM_Dreamshaper_v7 --include "*.safetensors" --include "*.json"
hf download lykon/dreamshaper-8 --include "*.safetensors" --include "*.json"
hf download kandinsky-community/kandinsky-2-2-decoder --include "*.safetensors" --include "*.json"
hf download kandinsky-community/kandinsky-2-2-prior --include "*.safetensors" --include "*.json"
"""

[dependencies]
ffmpeg = ">=9.0.2,<10"
numpy = ">=2.5.4,<3"
py-opencv = ">=5.0.0,<6"
diffusers = ">=0.41.0,<0.42"
pillow = ">=12.3.0,<13"
transformers = ">=5.19.0,<6"
ollama-python = ">=0.6.3,<0.7"
ipykernel = ">=7.4.0,<8"
pytorch = ">=2.13.0,<3"
torchvision = ">=0.28.0,<0.29"
ipywidgets = ">=8.1.9,<9"
accelerate = ">=1.15.0,<2"
requests = ">=2.34.2,<3"
scipy = ">=1.18.1,<2"
hf-xet = ">=1.7.0,<2"
imageio = ">=2.38.1,<3"
imageio-ffmpeg = ">=0.6.0,<0.7"
huggingface_hub = ">=1.32.0,<2"
pysoundfile = ">=0.14.0,<0.15"
gradio = ">=6.30.0,<7"
sentencepiece = ">=0.2.1,<0.3"
tensorboard = ">=2.21.0,<3"
openai-whisper = ">=20250625,<20250626"
ftfy = ">=6.3.1,<7"
pytesseract = ">=0.3.13,<0.4"
pyzmq = ">=27.2.0,<28"
uv = ">=0.13.1,<0.14"
ultralytics = ">=8.4.177,<9"

[pypi-dependencies]
kokoro = ">=0.9.4, <0.10"

[feature.dev.dependencies]
pre-commit = "*"

[environments]
default = []
dev = ["dev"]
